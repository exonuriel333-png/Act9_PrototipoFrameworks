<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - CUMARA</title>
<link rel="icon" href="../FAVICON/favicon.ico">
<link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
<main class="auth-container">
    <section class="auth-imagen" aria-label="León y Templo Expiatorio de León"></section>
    <section class="auth-formulario-wrapper">
        <div class="auth-formulario">
            <h1>Iniciar sesión</h1>
            <p class="auth-descripcion">Ingresa tus datos para continuar</p>
            <form action="dashboard.html" method="get">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    <div class="recuperar-password"><a href="#">¿Olvidaste tu contraseña?</a></div>
                </div>
                <button type="submit" class="btn-principal">Iniciar sesión →</button>
            </form>
            <div class="registro-enlace">
                <p>¿No tienes una cuenta?</p>
                <a href="registro.html" class="btn-secundario">Regístrate</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
