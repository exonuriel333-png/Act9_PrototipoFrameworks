<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear cuenta - CUMARA</title>
        <link rel="icon" href="../FAVICON/favicon.ico">
        <link rel="stylesheet" href="../CSS/style.css">
    </head>
<body>
    <main class="auth-container">
        <section class="auth-imagen" aria-label="León y Templo Expiatorio de León"></section>
        <section class="auth-formulario-wrapper">
            <div class="auth-formulario">
                <h1>Crear cuenta</h1>
                <p class="auth-descripcion">Completa tus datos para comenzar</p>
                <form action="dashboard.html" method="get">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmar-password">Confirmar contraseña</label>
                        <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Repite tu contraseña" required>
                    </div>
                    <fieldset class="tipo-usuario">
                        <legend>Tipo de usuario</legend>
                        <div class="opciones-rol">
                            <label class="opcion-rol">
                                <input type="radio" name="tipo_usuario" value="pasajero" required> Pasajero
                            </label>
                            <label class="opcion-rol">
                                <input type="radio" name="tipo_usuario" value="conductor"> Conductor
                            </label>
                        </div>
                    </fieldset>
                    <div class="terminos">
                        <label for="terminos">
                            <input type="checkbox" id="terminos" name="terminos" required>
                            <span>Acepto los 
                                <a href="#">Términos y condiciones</a>
                            </span>
                        </label>
                    </div>
                    <button type="submit" class="btn-principal">Registrarme →</button>
                </form>
                <div class="inicio-sesion">¿Ya tienes cuenta? 
                    <a href="index.html">Inicia sesión</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
